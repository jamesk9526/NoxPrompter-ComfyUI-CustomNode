<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Generator</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Prompt Generator</h1>
        <p>Generate creative prompts for your projects!</p>
    </header>
    <main>
        <section>
            <label for="promptInput">Enter your prompt:</label>
            <input type="text" id="promptInput" placeholder="Type your prompt here...">
            <button id="generateButton">Generate Prompt</button>
        </section>
        <section id="outputSection">
            <h2>Your Generated Prompt:</h2>
            <p id="generatedPrompt"></p>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Prompt Generator. All rights reserved.</p>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
